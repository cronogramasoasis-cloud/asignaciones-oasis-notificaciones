name: Notificaciones Oasis

on:
  workflow_dispatch:
  schedule:
    # Cada 5 minutos de 7:00 a 20:55, hora de Caracas.
    - cron: '*/5 7-20 * * *'
      timezone: 'America/Caracas'
    # Última revisión diaria a las 21:00 (9:00 p. m.).
    - cron: '0 21 * * *'
      timezone: 'America/Caracas'

permissions:
  contents: read

jobs:
  enviar-notificaciones:
    runs-on: ubuntu-slim
    timeout-minutes: 6

    steps:
      - name: Descargar código
        uses: actions/checkout@v7

      - name: Configurar Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: server/package.json

      - name: Instalar dependencias
        working-directory: server
        run: npm install --omit=dev --no-audit --no-fund

      - name: Ejecutar una revisión de notificaciones
        working-directory: server
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
          APP_TIMEZONE: America/Caracas
          PUBLIC_APP_URL: https://cronogramas-oasis.netlify.app/
          RUN_ONCE: 'true'
        run: node server.js --once
